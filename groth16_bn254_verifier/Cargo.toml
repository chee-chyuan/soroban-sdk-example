[package]
name = "soroban-groth16-bn254-verifier-contract"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
ark-bn254 = { version = "0.5.0", default-features = false, features = [
    "curve",
] }
ark-ff = { version = "0.5.0", default-features = false }
ark-groth16 = { version = "0.5.0", default-features = false }
ark-ec = { version = "0.5.0", default-features = false }
# soroban-sdk = { version = "22.0.1" }
soroban-sdk = { git = "https://github.com/jayz22/rs-soroban-sdk.git", rev = "183f527a763ae12611870fd16724b89e5e40ad33" }
wee_alloc = "0.4.5"

[dev-dependencies]
# soroban-sdk = { version = "22.0.1", features = ["testutils"] }
soroban-sdk = { git = "https://github.com/jayz22/rs-soroban-sdk.git", rev = "183f527a763ae12611870fd16724b89e5e40ad33", features = [
    "testutils",
] }
risc0-groth16 = "2.0.1"
serde = { version = "1.0", default-features = false, features = [
    "alloc",
    "derive",
] }
serde_json = { version = "1.0" }
ark-serialize = { version = "0.5", default-features = false }
anyhow = { version = "1.0", default-features = false }
num-bigint = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
# ark-bls12-381 = { version = "0.4.0"}
# ark-serialize = { version = "0.4.2"}
# ark-ff = { version = "0.4.2"}
# ark-ec = { version = "0.4.2"}

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
